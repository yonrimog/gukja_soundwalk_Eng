<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#202321">
  <title>Ladle & Spatula Sound Walk</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root { color-scheme: light; --ink:#202321; --accent:#2586c8; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans",sans-serif; }
    #map { position:fixed; inset:0; background:#e9e6df; }
    .panel { position:fixed; z-index:1000; top:max(16px, env(safe-area-inset-top)); left:16px; right:16px; max-width:760px; margin:0 auto; padding:20px 22px 18px; border-radius:25px; color:#fff; background:rgba(32,35,33,.94); box-shadow:0 8px 28px #0003; }
    h1 { margin:0 0 7px; font-size:clamp(21px,4.8vw,30px); line-height:1.25; font-weight:750; }
    #message { margin:0 0 15px; color:#dedede; font-size:clamp(15px,3.8vw,20px); line-height:1.45; }
    .controls { display:flex; align-items:center; flex-wrap:wrap; gap:9px; }
    button { border:0; border-radius:17px; padding:13px 21px; min-height:52px; font:700 17px inherit; font-size:17px; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    #gpsButton { color:#151515; background:#fff; }
    #pauseButton { color:#fff; background:#4b514d; }
    #gpsState { margin-left:auto; color:#c8d0cb; font-size:12px; }
    .now-playing { margin-top:12px; min-height:20px; color:#e9ecea; font-size:14px; }
    .leaflet-control-attribution { font-size:10px !important; }
    .point-label { background:rgba(32,35,33,.88); color:#fff; border:0; border-radius:10px; padding:7px 10px; font-size:14px; font-weight:700; box-shadow:0 2px 8px #0003; white-space:nowrap; }
    .point-label:before { display:none; }
    .point-number { width:30px; height:30px; border:3px solid #2586c8; border-radius:50%; background:#ffffffd9; color:#174e76; display:grid; place-items:center; font-size:14px; font-weight:800; box-shadow:0 1px 5px #0003; }
    .user-dot { width:18px; height:18px; border:3px solid white; border-radius:50%; background:#1687dc; box-shadow:0 0 0 5px #1687dc44,0 1px 5px #0005; }
    .leaflet-div-icon { background:transparent; border:0; }
    @media (max-width:520px) { .panel { padding:17px 18px 15px; border-radius:22px; } button { min-height:48px; padding:11px 17px; } #gpsState { width:100%; margin:0; } .point-label { font-size:12px; padding:6px 8px; } }
  </style>
</head>
<body>
  <div id="map" aria-label="Ladle & Spatula Sound Walk map"></div>
  <section class="panel" aria-label="Sound Walk controls">
    <h1>Ladle &amp; Spatula Sound Walk</h1>
    <p id="message">Tap “Start GPS” to begin.</p>
    <div class="controls">
      <button id="gpsButton">Start GPS</button>
      <button id="pauseButton" disabled>Pause audio</button>
      <span id="gpsState">Waiting for location</span>
    </div>
    <div class="now-playing" id="nowPlaying">Waiting for audio.</div>
  </section>
  <audio id="player" preload="auto"></audio>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    // Coordinates were converted from the supplied degrees-minutes-seconds (DMS) values.
    const points = [
      { n:1, name:'Ladle & Spatula', lat:37.653333, lng:126.445000, audio:'audio/1.mp3' },
      { n:2, name:'The Dead Tree', lat:37.653056, lng:126.446111, audio:'audio/2.mp3' },
      { n:3, name:'The Earthen House', lat:37.653333, lng:126.446944, audio:'audio/3.mp3', radius:18 },
      { n:4, name:'Left Turn After the Earthen House', lat:37.653056, lng:126.447222, audio:'audio/4.mp3', radius:18 },
      { n:5, name:'Left Turn at the Intersection', lat:37.654444, lng:126.446667, audio:'audio/5.mp3' },
      { n:6, name:'Namcheon Intersection', lat:37.654167, lng:126.443333, audio:'audio/6.mp3' },
      { n:7, name:'Final Intersection', lat:37.653056, lng:126.443333, audio:'audio/7.mp3' }
    ];
    const DEFAULT_RADIUS_METERS = 20;
    const radiusFor = point => point.radius ?? DEFAULT_RADIUS_METERS;
    const FADE_MS = 2000;
    const map = L.map('map', { zoomControl:true }).setView([37.6537,126.4452], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom:20, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    const bounds = [];
    points.forEach(p => {
      const marker = L.marker([p.lat,p.lng], { icon:L.divIcon({className:'', html:`<div class="point-number">${p.n}</div>`, iconSize:[30,30], iconAnchor:[15,15]}) }).addTo(map);
      marker.bindTooltip(`${p.n}. ${p.name}`, { permanent:true, direction:'right', offset:[9,0], className:'point-label' });
      L.circle([p.lat,p.lng], { radius:radiusFor(p), color:'#2586c8', weight:1, opacity:.35, fillColor:'#2586c8', fillOpacity:.045, interactive:false }).addTo(map);
      bounds.push([p.lat,p.lng]);
    });
    // Fit the full route on screen while allowing space for the control panel on mobile.
    map.fitBounds(bounds, { paddingTopLeft:[28,190], paddingBottomRight:[28,35], maxZoom:17 });

    const player = document.getElementById('player');
    const gpsButton = document.getElementById('gpsButton');
    const pauseButton = document.getElementById('pauseButton');
    const message = document.getElementById('message');
    const gpsState = document.getElementById('gpsState');
    const nowPlaying = document.getElementById('nowPlaying');
    let watchId = null;
    let nextPointIndex = 0;
    const playedPoints = new Set();
    let currentPoint = null;
    let isPaused = false;
    let isTransitioning = false;
    let userMarker = null;
    let userAccuracy = null;
    let lastPosition = null;

    function distanceMeters(aLat,aLng,bLat,bLng) {
      return map.distance([aLat,aLng],[bLat,bLng]);
    }
    function setMessage(text) { message.textContent = text; }
    function updatePauseButton() {
      pauseButton.disabled = !currentPoint;
      pauseButton.textContent = isPaused ? 'Resume audio' : 'Pause audio';
    }
    async function playPoint(point) {
      if (isTransitioning || playedPoints.has(point.n)) return;
      isTransitioning = true;
      playedPoints.add(point.n);
      const wasPaused = isPaused;
      if (currentPoint && !player.paused) {
        const startVolume = player.volume;
        const steps = 20;
        for (let i=steps-1; i>=0; i--) {
          player.volume = startVolume * i / steps;
          await new Promise(resolve => setTimeout(resolve, FADE_MS/steps));
        }
        player.pause();
      } else {
        player.pause();
      }
      player.src = point.audio;
      player.volume = 1;
      player.load();
      currentPoint = point;
      isPaused = wasPaused;
      nextPointIndex = point.n; // Continue GPS checks from the next numbered stop
      nowPlaying.textContent = `Track ${point.n} · ${point.name}`;
      setMessage(`You have reached stop ${point.n}.`);
      updatePauseButton();
      if (!isPaused) {
        try {
          await player.play();
          isPaused = false;
          setMessage(`You have reached stop ${point.n}.`);
        } catch (err) {
          isPaused = true;
          setMessage('Your browser blocked audio playback. Tap Start GPS again to allow audio.');
          pauseButton.disabled = false;
          pauseButton.textContent = 'Play audio';
        }
      }
      isTransitioning = false;
    }

    function onPosition(position) {
      const { latitude, longitude, accuracy } = position.coords;
      lastPosition = { lat:latitude, lng:longitude };
      gpsState.textContent = `GPS accuracy: about ${Math.round(accuracy)} m`;
      if (!userMarker) {
        userMarker = L.marker([latitude,longitude], { icon:L.divIcon({className:'',html:'<div class="user-dot"></div>',iconSize:[18,18],iconAnchor:[9,9]}), zIndexOffset:1000 }).addTo(map);
        userAccuracy = L.circle([latitude,longitude], { radius:accuracy, color:'#1687dc', weight:1, opacity:.35, fillOpacity:.06 }).addTo(map);
        map.setView([latitude,longitude], 18);
      } else {
        userMarker.setLatLng([latitude,longitude]);
        userAccuracy.setLatLng([latitude,longitude]);
        userAccuracy.setRadius(accuracy);
      }
      if (nextPointIndex >= points.length || isTransitioning) return;
      const target = points[nextPointIndex];
      if (playedPoints.has(target.n)) return;
      const distance = distanceMeters(latitude,longitude,target.lat,target.lng);
      if (distance <= radiusFor(target)) {
        // Do not advance to stop 4 until the audio for stop 3 has finished.
        if (target.n === 4 && currentPoint?.n === 3 && !player.ended) return;
        // Process stops once and in order. GPS drift within a radius will not restart a stop.
        playPoint(target);
      } else {
        setMessage(currentPoint ? `Playing stop ${currentPoint.n} · Next: stop ${target.n}, ${target.name}` : `Head to stop 1. (About ${Math.round(distance)} m away)`);
      }
    }
    function onGpsError(error) {
      const messages = { 1:'Location permission was denied. Allow location access in your browser settings.', 2:'Your current location could not be determined.', 3:'The GPS request timed out.' };
      setMessage(messages[error.code] || 'A GPS error occurred.');
      gpsState.textContent = 'GPS connection error';
    }
    gpsButton.addEventListener('click', () => {
      if (!navigator.geolocation) { setMessage('This browser does not support GPS location.'); return; }
      if (watchId !== null) return;
      gpsButton.disabled = true;
      gpsButton.textContent = 'GPS running';
      setMessage('Finding your location…');
      // Attempt to unlock mobile-browser autoplay within the user gesture on the GPS button.
      // Briefly play while muted, then stop playback and unmute.
      player.muted = true;
      const unlockPromise = player.play();
      if (unlockPromise && typeof unlockPromise.then === 'function') {
        unlockPromise.then(() => {
          player.pause();
          player.currentTime = 0;
          player.muted = false;
        }).catch(() => { player.muted = false; });
      } else {
        player.pause();
        player.muted = false;
      }
      watchId = navigator.geolocation.watchPosition(onPosition,onGpsError,{ enableHighAccuracy:true, maximumAge:1000, timeout:20000 });
    });
    pauseButton.addEventListener('click', async () => {
      if (!currentPoint) return;
      if (isPaused || player.paused) {
        isPaused = false;
        try { await player.play(); setMessage(`Playing audio for stop ${currentPoint.n}.`); }
        catch (err) { isPaused = true; setMessage('Please check the audio file.'); }
      } else {
        player.pause();
        isPaused = true;
        setMessage('Audio paused.');
      }
      updatePauseButton();
    });
    player.addEventListener('ended', () => {
      if (!currentPoint) return;
      setMessage(`Audio for stop ${currentPoint.n} has finished. Continue to the next stop.`);
      // If the user is already within stop 4 radius when stop 3 ends, start stop 4 then.
      if (currentPoint.n === 3 && lastPosition && nextPointIndex === 3) {
        const target = points[3];
        const distance = distanceMeters(lastPosition.lat,lastPosition.lng,target.lat,target.lng);
        if (distance <= radiusFor(target)) playPoint(target);
      }
    });
    player.addEventListener('error', () => {
      if (currentPoint) setMessage(`Audio file for stop ${currentPoint.n} could not be found. Check the filenames in the audio folder.`);
    });
  </script>
</body>
</html>
